services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_erp_postgres
    environment:
      POSTGRES_DB: saas_erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d/
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_erp_backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/saas_erp_db
      ETA_API_BASE_URL: https://api.preprod.invoicing.eta.gov.eg
    depends_on:
      - postgres

  frontend:
    image: nginx:alpine
    container_name: saas_erp_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: saas_erp_appsmith
    ports:
      - "8000:80"
    environment:
      APPSMITH_SERVER_PORT: 80
    volumes:
      - appsmith_stacks:/appsmith-stacks
    depends_on:
      - backend

volumes:
  appsmith_stacks:

